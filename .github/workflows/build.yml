name: Build ROCCA DCO Apps

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build + Sign + Package
    runs-on: windows-latest
    env:
      APP_VERSION: ""

    steps:
      # This repo only contains the workflow — actual source is on origin
      - name: Checkout source from 1st repo
        uses: actions/checkout@v4
        with:
          repository: Alex-Leo-Reeves/Rocca-DCO-Filesystem
          token: ${{ secrets.PAT_ORIGIN }}
          path: source

      - name: Move source to root
        shell: pwsh
        run: |
          Move-Item -Path "source/*" -Destination . -Force
          Move-Item -Path "source/.*" -Destination . -Force -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force source -ErrorAction SilentlyContinue

      # --- Setup tools ---
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.x'

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Download and stage portable Node.js runtime
        shell: pwsh
        run: |
          # I19: stage the FULL portable Node.js runtime so the admin installer
          # bundles {app}\nodejs\node.exe + {app}\nodejs\portable\npm.cmd.
          # The server then runs EXCLUSIVELY on the bundled runtime (start.bat
          # prefers node.exe; the splash derives npm.cmd from the same folder),
          # so no system-wide Node install is required.
          $nodeDir = "installers\nodejs"
          New-Item -ItemType Directory -Force -Path $nodeDir | Out-Null
          $zip = "$nodeDir\node-v22.14.0-win-x64.zip"
          $download = $true
          if (Test-Path $zip) {
            if ((Get-Item $zip).Length -gt 10MB) {
              $download = $false
            }
          }
          if ($download) {
            Write-Host "Downloading portable Node.js v22.14.0 ZIP..."
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            Invoke-WebRequest -Uri "https://nodejs.org/dist/v22.14.0/node-v22.14.0-win-x64.zip" -OutFile $zip -UseBasicParsing
            if (-not (Test-Path $zip)) { Write-Host "❌ Node.js ZIP download failed"; exit 1 }
          }

          # Extract the full portable runtime (node.exe + npm.cmd + node_modules\npm)
          $extractTo = "$nodeDir\portable"
          if (Test-Path $extractTo) { Remove-Item -Recurse -Force $extractTo }
          Expand-Archive -Path $zip -DestinationPath $extractTo -Force
          # Flatten the versioned wrapper folder (node-v22.14.0-win-x64) into portable\
          $inner = Get-ChildItem -Path $extractTo -Directory | Select-Object -First 1
          if ($inner) {
            Get-ChildItem -Path $inner.FullName | ForEach-Object {
              Move-Item -Force $_.FullName $extractTo
            }
            Remove-Item -Recurse -Force $inner.FullName
          }
          if (-not (Test-Path "$extractTo\node.exe")) { Write-Host "❌ node.exe missing after extraction"; exit 1 }
          if (-not (Test-Path "$extractTo\npm.cmd")) { Write-Host "❌ npm.cmd missing after extraction"; exit 1 }

          # Copy node.exe to the legacy/expected location too (start.bat + splash both check it)
          Copy-Item -Force "$extractTo\node.exe" "$nodeDir\node.exe"
          Write-Host "✅ Portable Node.js staged: $nodeDir\node.exe + portable\npm.cmd"
          # The ZIP is kept cached in CI for rebuilds.

      # ============================
      # GENERATE CODE SIGNING CERT
      # ============================
      - name: Generate signing certificate
        shell: pwsh
        run: |
          $CertName = "ROCCA DCO Filesystem"
          $PfxPath = "installers\RoccaDCO.pfx"
          $CerPath = "installers\RoccaDCO.cer"

          $existing = Get-ChildItem -Path "Cert:\CurrentUser\My" | Where-Object { $_.Subject -eq "CN=$CertName" }
          if (-not $existing) {
            Write-Host "Creating code signing certificate..."
            $cert = New-SelfSignedCertificate `
              -Type Custom `
              -Subject "CN=Ozegbe Mike Isioma, O=Rocca DCO, C=NG" `
              -FriendlyName $CertName `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -NotAfter (Get-Date).AddYears(5) `
              -KeyUsage DigitalSignature `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
            $password = ConvertTo-SecureString -String "RoccaDCO2024" -Force -AsPlainText
            Export-PfxCertificate -Cert $cert -FilePath $PfxPath -Password $password | Out-Null
            Export-Certificate -Cert $cert -FilePath $CerPath -Type CERT | Out-Null
            Write-Host "Certificate created: $CerPath"
          } else {
            Write-Host "Using existing certificate"
          }

      # ============================
      # BUILD: Admin App
      # ============================
      - name: Clean and get dependencies (Admin App)
        run: |
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }
          flutter clean
          flutter pub get
        working-directory: admin_app
        shell: pwsh

      - name: Build Admin App (Windows)
        run: flutter build windows --release
        working-directory: admin_app

      # ============================
      # BUILD: User App
      # ============================
      - name: Clean and get dependencies (User App)
        run: |
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }
          if (Test-Path ".dart_tool") { Remove-Item -Recurse -Force ".dart_tool" }
          flutter clean
          flutter pub get
        working-directory: user_app
        shell: pwsh

      - name: Analyze (User App)
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
        working-directory: user_app
        continue-on-error: true

      - name: Build User App (Windows)
        run: flutter build windows --release
        working-directory: user_app

      # ============================
      # BUILD: Server Core
      # ============================
      - name: Install server dependencies (sql.js primary — no native compilation)
        run: npm install
        working-directory: server_core

      # ============================
      # SIGN + COPY: Admin App (must come BEFORE server_core staging)
      # ============================
      - name: Sign and stage Admin app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installers/admin_release
          $paths = @(
            "admin_app/build/windows/runner/Release",
            "admin_app/build/windows/x64/runner/Release"
          )
          $exePath = $null
          foreach ($p in $paths) {
            $test = "$p/rocca_dco_admin.exe"
            if (Test-Path $test) { $exePath = $test; break }
          }
          if (-not $exePath) { Write-Host "ERROR: Admin .exe not found!"; exit 1 }
          Write-Host "Found at: $exePath"
          $srcDir = Split-Path $exePath -Parent
          Copy-Item -Recurse -Force -Path "$srcDir/*" -Destination "installers/admin_release/"
          $cert = Get-ChildItem -Path "Cert:\CurrentUser\My" | Where-Object { $_.Subject -like "*Ozegbe Mike Isioma*" }
          if ($cert) {
            Set-AuthenticodeSignature -FilePath $exePath -Certificate $cert -TimestampServer "http://timestamp.digicert.com" -HashAlgorithm SHA256
            Write-Host "✅ Admin exe signed"
          }

      # ============================
      # STAGE: Copy server_core WITH node_modules AND start.bat
      # ============================
      - name: Stage server_core for installer
        shell: pwsh
        run: |
          $target = "installers\admin_release\server_core"
          New-Item -ItemType Directory -Force -Path "$target\src" | Out-Null
          Copy-Item -Recurse -Force "server_core\package.json" "$target\package.json"
          Copy-Item -Recurse -Force "server_core\package-lock.json" "$target\package-lock.json"
          Copy-Item -Recurse -Force "server_core\src\*" "$target\src\"
          # Copy start.bat so the splash screen can launch the server via batch file
          if (Test-Path "server_core\start.bat") {
            Copy-Item -Force "server_core\start.bat" "$target\start.bat"
            Write-Host "✅ start.bat staged"
          } else {
            Write-Host "⚠️  start.bat not found in server_core root"
          }
          Write-Host "Copying node_modules (this may take a minute)..."
          Copy-Item -Recurse -Force "server_core\node_modules" "$target\node_modules"
          if (Test-Path "$target\node_modules\.bin") {
            Remove-Item -Recurse -Force "$target\node_modules\.bin"
          }
          Get-ChildItem -Path "$target\node_modules" -Recurse -Directory -Filter ".git" -ErrorAction SilentlyContinue | ForEach-Object {
            Remove-Item -Recurse -Force $_.FullName -ErrorAction SilentlyContinue
          }
          if (Test-Path "$target\src\index.js") {
            Write-Host "✅ Server core staged (with node_modules + start.bat)"
          } else {
            Write-Host "❌ ERROR: server_core\src\index.js not found after staging!"
            exit 1
          }

      # ============================
      # Download Ghostscript — MUST match filename in admin_installer.iss
      # .iss expects: ghostscript\gs10071w64.exe
      # ============================
      - name: Download Ghostscript installer
        shell: pwsh
        run: |
          $url = "https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10071/gs10071w64.exe"
          $out = "installers\ghostscript\gs10071w64.exe"
          New-Item -ItemType Directory -Force -Path (Split-Path $out) | Out-Null
          Write-Host "Downloading Ghostscript..."
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          if (-not (Test-Path $out)) { Write-Host "❌ Download failed"; exit 1 }

      # ============================
      # ROBUST LibreOffice download with retries + mirrors + fallbacks
      # ============================
      - name: Download LibreOffice installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $out = "installers\libreoffice\LibreOffice_26.2.4_Win_x86-64.msi"
          $extractDir = "installers\libreoffice\portable"
          New-Item -ItemType Directory -Force -Path (Split-Path $out) | Out-Null
          New-Item -ItemType Directory -Force -Path "$extractDir\program" | Out-Null

          # Primary + mirrors
          $urls = @(
            "https://download.documentfoundation.org/libreoffice/stable/26.2.4/win/x86_64/LibreOffice_26.2.4_Win_x86-64.msi",
            "https://mirror.ibcp.fr/pub/tdf/libreoffice/stable/26.2.4/win/x86_64/LibreOffice_26.2.4_Win_x86-64.msi",
            "https://ftp.yz.yamagata-u.ac.jp/pub/network/misc/tdf/libreoffice/stable/26.2.4/win/x86_64/LibreOffice_26.2.4_Win_x86-64.msi",
            "https://mirror.aarnet.edu.au/pub/tdf/libreoffice/stable/26.2.4/win/x86_64/LibreOffice_26.2.4_Win_x86-64.msi",
            "https://mirrors.dotsrc.org/tdf/libreoffice/stable/26.2.4/win/x86_64/LibreOffice_26.2.4_Win_x86-64.msi"
          )

          $downloaded = $false
          $extracted = $false

          # ========== DOWNLOAD with retries ==========
          Write-Host "=== Downloading LibreOffice 26.2.4 ==="

          :outer foreach ($url in $urls) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              Write-Host "Attempt $attempt/3 — $url"
              try {
                # Method A: Invoke-WebRequest
                [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
                Invoke-WebRequest -Uri $url -OutFile "$out.tmp" -UseBasicParsing -TimeoutSec 300 -ErrorAction Stop
                if ((Get-Item "$out.tmp").Length -gt 10MB) {
                  Move-Item -Force "$out.tmp" $out
                  Write-Host "✅ Downloaded ($((Get-Item $out).Length / 1MB -as [int]) MB)"
                  $downloaded = $true
                  break outer
                } else {
                  Write-Host "⚠️  File too small ($((Get-Item "$out.tmp").Length) bytes), trying next..."
                  Remove-Item "$out.tmp" -Force -ErrorAction SilentlyContinue
                }
              } catch {
                Write-Host "⚠️  Invoke-WebRequest failed: $($_.Exception.Message)"
                Remove-Item "$out.tmp" -Force -ErrorAction SilentlyContinue
              }

              # Method B: curl.exe fallback
              try {
                $curl = Get-Command "curl.exe" -ErrorAction Stop
                Write-Host "Trying curl.exe..."
                & $curl -L -o "$out.tmp" --connect-timeout 60 --max-time 600 $url 2>&1 | Out-Null
                if ((Test-Path "$out.tmp") -and ((Get-Item "$out.tmp").Length -gt 10MB)) {
                  Move-Item -Force "$out.tmp" $out
                  Write-Host "✅ Downloaded via curl ($((Get-Item $out).Length / 1MB -as [int]) MB)"
                  $downloaded = $true
                  break outer
                } else {
                  Remove-Item "$out.tmp" -Force -ErrorAction SilentlyContinue
                }
              } catch {
                Write-Host "⚠️  curl.exe not available or failed"
                Remove-Item "$out.tmp" -Force -ErrorAction SilentlyContinue
              }

              # Method C: Start-BitsTransfer
              try {
                Write-Host "Trying Start-BitsTransfer..."
                Start-BitsTransfer -Source $url -Destination "$out.tmp" -Asynchronous -Priority High -ErrorAction Stop
                $job = Get-BitsTransfer | Where-Object { $_.JobState -ne "Transferred" -and $_.JobState -ne "Error" } | Select-Object -First 1
                if ($job) { Complete-BitsTransfer -BitsJob $job }
                if ((Test-Path "$out.tmp") -and ((Get-Item "$out.tmp").Length -gt 10MB)) {
                  Move-Item -Force "$out.tmp" $out
                  Write-Host "✅ Downloaded via BITS ($((Get-Item $out).Length / 1MB -as [int]) MB)"
                  $downloaded = $true
                  break outer
                } else {
                  Remove-Item "$out.tmp" -Force -ErrorAction SilentlyContinue
                }
              } catch {
                Write-Host "⚠️  BITS transfer failed"
                Remove-Item "$out.tmp" -Force -ErrorAction SilentlyContinue
              }

              if ($attempt -lt 3) {
                $wait = $attempt * 10
                Write-Host "Waiting ${wait}s before retry..."
                Start-Sleep -Seconds $wait
              }
            }
          }

          # ========== EXTRACTION (only if MSI downloaded) ==========
          if ($downloaded) {
            Write-Host "=== Extracting LibreOffice to portable folder ==="
            # Method 1: msiexec /a
            try {
              $proc = Start-Process -FilePath "msiexec" -ArgumentList "/a `"$out`" TARGETDIR=`"$extractDir`" /quiet" -Wait -PassThru -NoNewWindow -ErrorAction Stop
              if ($proc.ExitCode -eq 0 -and (Test-Path "$extractDir\program\soffice.exe")) {
                Write-Host "✅ LibreOffice extracted via msiexec /a"
                $extracted = $true
              }
            } catch {
              Write-Host "⚠️  msiexec /a failed: $_"
            }

            # Method 2: 7zip fallback
            if (-not $extracted) {
              try {
                $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe"
                if (Test-Path $sevenZip) {
                  Write-Host "Extracting MSI with 7zip..."
                  & $sevenZip x "$out" -o"$extractDir" -y * 2>&1 | Out-Null
                  Get-ChildItem "$extractDir" -Filter "*.cab" | ForEach-Object {
                    & $sevenZip x $_.FullName -o"$extractDir" -y * 2>&1 | Out-Null
                  }
                  if (Test-Path "$extractDir\program\soffice.exe") {
                    Write-Host "✅ LibreOffice extracted via 7zip"
                    $extracted = $true
                  }
                } else {
                  Write-Host "7-Zip not found at $sevenZip"
                }
              } catch {
                Write-Host "⚠️  7zip extraction also failed: $_"
              }
            }
          }

          # ========== I20: TRIM the portable tree (multi-language/help/samples) ==========
          # The full extracted tree is ~1.5 GB; the bundled installer only ships
          # English. Removing help packs, samples, templates, extensions and
          # non-English locales keeps the portable bundle a fraction of the size.
          # office.js launches {app}\libreoffice\program\soffice.exe --headless
          # with flags that work identically on the trimmed tree.
          if ($extracted) {
            Write-Host "Trimming portable LibreOffice (I20)..." -ForegroundColor Yellow
            $trimDirs = @(
              "$extractDir\share\help",
              "$extractDir\share\samples",
              "$extractDir\share\template",
              "$extractDir\share\templates",
              "$extractDir\share\extensions",
              "$extractDir\share\config",
              "$extractDir\program\resource\help",
              "$extractDir\program\lib\liblangpack*"
            )
            foreach ($d in $trimDirs) {
              if (Test-Path $d) { Remove-Item -Recurse -Force $d -ErrorAction SilentlyContinue }
            }
            $resLocaleDir = "$extractDir\program\resources"
            if (Test-Path $resLocaleDir) {
              Get-ChildItem -Path $resLocaleDir -Directory | Where-Object { $_.Name -notmatch '^(en|en-US|en_US|qtz)$' } | ForEach-Object {
                Remove-Item -Recurse -Force $_.FullName -ErrorAction SilentlyContinue
              }
            }
            # Remove the big unneeded MSI payload pieces extracted by msiexec /a
            Remove-Item -Recurse -Force "$extractDir\Windows" -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force "$extractDir\Source" -ErrorAction SilentlyContinue
            Write-Host "  ✅ Trimmed (final size: $(((Get-ChildItem -Recurse -File $extractDir | Measure-Object -Property Length -Sum).Sum / 1MB) -as [int]) MB)" -ForegroundColor Green
          }

          # ========== FINAL: success or placeholder ==========
          if ($extracted) {
            Write-Host "🎉 LibreOffice successfully bundled!" -ForegroundColor Green
          } else {
            if ($downloaded) {
              Write-Host "⚠️  MSI downloaded but extraction failed — keeping MSI for installer"
            } else {
              Write-Host "⚠️  LibreOffice could not be downloaded from any mirror — installer will build without PDF conversion support"
              if (Test-Path $out) { Remove-Item -Force $out -ErrorAction SilentlyContinue }
              Set-Content -Path "$extractDir\README.txt" -Value "LibreOffice was not bundled in this build.`r`nThe server will work but Office-to-PDF conversion requires LibreOffice to be installed separately."
            }
          }

      - name: Create Admin Installer
        shell: cmd
        run: iscc admin_installer.iss
        working-directory: installers

      # ============================
      # SIGN + COPY: User App
      # ============================
      - name: Sign and stage User app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installers/user_release
          $paths = @(
            "user_app/build/windows/runner/Release",
            "user_app/build/windows/x64/runner/Release"
          )
          $exePath = $null
          foreach ($p in $paths) {
            $test = "$p/rocca_dco_user.exe"
            if (Test-Path $test) { $exePath = $test; break }
          }
          if (-not $exePath) { Write-Host "ERROR: User .exe not found!"; exit 1 }
          Write-Host "Found at: $exePath"
          $srcDir = Split-Path $exePath -Parent
          Copy-Item -Recurse -Force -Path "$srcDir/*" -Destination "installers/user_release/"
          $cert = Get-ChildItem -Path "Cert:\CurrentUser\My" | Where-Object { $_.Subject -like "*Ozegbe Mike Isioma*" }
          if ($cert) {
            Set-AuthenticodeSignature -FilePath $exePath -Certificate $cert -TimestampServer "http://timestamp.digicert.com" -HashAlgorithm SHA256
            Write-Host "✅ User exe signed"
          }

      - name: Create User Installer
        shell: cmd
        run: iscc user_installer.iss
        working-directory: installers

      # ============================
      # DETECT VERSION & SIGN INSTALLERS
      # ============================
      - name: Detect version
        shell: pwsh
        run: |
          $configPath = "server_core\src\config.js"
          $version = "1.3.0" # fallback
          if (Test-Path $configPath) {
            $content = Get-Content $configPath -Raw
            $match = [regex]::Match($content, "APP_VERSION:\s*'([\d.]+)'")
            if ($match.Success) { $version = $match.Groups[1].Value }
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "✅ Detected version: $version"

      - name: Sign the installers
        shell: pwsh
        run: |
          Write-Host "Using version: $env:APP_VERSION"
          $cert = Get-ChildItem -Path "Cert:\CurrentUser\My" | Where-Object { $_.Subject -like "*Ozegbe Mike Isioma*" }
          if ($cert) {
            $installers = @(
              "dist/RoccaDCO_Admin_Setup_v$env:APP_VERSION.exe",
              "dist/RoccaDCO_User_Setup_v$env:APP_VERSION.exe"
            )
            foreach ($exe in $installers) {
              if (Test-Path $exe) {
                Set-AuthenticodeSignature -FilePath $exe -Certificate $cert -TimestampServer "http://timestamp.digicert.com" -HashAlgorithm SHA256
                Write-Host "✅ Signed installer: $exe"
              } else {
                Write-Host "⚠️  Not found (build may have failed): $exe"
              }
            }
          }

      # ============================
      # UPLOAD
      # ============================
      - name: Upload Admin Installer
        uses: actions/upload-artifact@v4
        with:
          name: RoccaDCO_Admin_Setup_v${{ env.APP_VERSION }}
          path: dist/RoccaDCO_Admin_Setup_v${{ env.APP_VERSION }}.exe
          if-no-files-found: error
          compression-level: 0

      - name: Upload User Installer
        uses: actions/upload-artifact@v4
        with:
          name: RoccaDCO_User_Setup_v${{ env.APP_VERSION }}
          path: dist/RoccaDCO_User_Setup_v${{ env.APP_VERSION }}.exe
          if-no-files-found: error
          compression-level: 0

      - name: Upload Certificate
        uses: actions/upload-artifact@v4
        with:
          name: RoccaDCO.cer
          path: installers/RoccaDCO.cer
          compression-level: 0
